services:
  web:
    build:
      context: .
      args:
        API_URL: ${API_URL:?Set API_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
        ROOT_ID: "1"
        NEXT_PUBLIC_ROOT_ID: "1"
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
    environment:
      API_URL: ${API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      ROOT_ID: "1"
      NEXT_PUBLIC_ROOT_ID: "1"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - "127.0.0.1:3000:3000"
